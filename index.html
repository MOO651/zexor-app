<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F4" />
    <script>
      (() => {
        const root = document.documentElement;
        // ZEXOR uses the approved white-and-beige identity on every device.
        // Do not flash a system-dark theme before the application styles load.
        const theme = 'light';
        try {
          const storedLocale = window.localStorage.getItem('zexor-locale');
          if (storedLocale === 'ar' || storedLocale === 'en') {
            root.lang = storedLocale;
            root.dir = storedLocale === 'ar' ? 'rtl' : 'ltr';
          }
        } catch {
          // Keep the Arabic default when browser storage is unavailable.
        }
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#FAF8F4');
      })();
    </script>
    <meta name="description" content="ZEXOR brings smart NFC identity, considered fashion, digital studio services, curated vehicles and spaces, and distinctive vintage finds together across Egypt and Saudi Arabia." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZEXOR — One Identity. Many Worlds." />
    <meta property="og:description" content="Smart identity, fashion, digital experiences, curated spaces, and vintage finds across Egypt and Saudi Arabia." />
    <meta property="og:image" content="./zexor-logo-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZEXOR — Design · Technology · Culture" />
    <meta name="twitter:description" content="NFC identity, considered streetwear, digital experiences, and vintage finds for Egypt and Saudi Arabia." />
    <meta name="twitter:image" content="./zexor-logo-social.png" />
    <title>ZEXOR — Design · Technology · Culture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
