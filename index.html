<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F0E6" />
    <script>
      (() => {
        const root = document.documentElement;
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const storedTheme = JSON.parse(window.localStorage.getItem('zexor-theme') || 'null');
          const storedLocale = window.localStorage.getItem('zexor-locale');
          if (storedTheme === 'light' || storedTheme === 'dark') theme = storedTheme;
          if (storedLocale === 'ar' || storedLocale === 'en') {
            root.lang = storedLocale;
            root.dir = storedLocale === 'ar' ? 'rtl' : 'ltr';
          }
        } catch {
          // Keep the system theme and Arabic defaults when browser storage is unavailable.
        }
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          theme === 'dark' ? '#07130E' : '#F4F0E6',
        );
      })();
    </script>
    <meta name="description" content="ZEXOR connects NFC business cards, considered streetwear, and digital experiences across Egypt and Saudi Arabia." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZEXOR — Design · Technology · Culture" />
    <meta property="og:description" content="NFC identity, considered streetwear, and digital experiences for Egypt and Saudi Arabia." />
    <meta property="og:image" content="./zexor-logo-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZEXOR — Design · Technology · Culture" />
    <meta name="twitter:description" content="NFC identity, considered streetwear, and digital experiences for Egypt and Saudi Arabia." />
    <meta name="twitter:image" content="./zexor-logo-social.png" />
    <title>ZEXOR — Design · Technology · Culture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
