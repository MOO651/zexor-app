<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Luxury SUV">
  <defs>
    <!-- Bright showroom, matching the sedan plate. -->
    <linearGradient id="u-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="46%" stop-color="#BBD0C3"/>
      <stop offset="100%" stop-color="#8DB8A0"/>
    </linearGradient>
    <linearGradient id="u-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7F73"/>
      <stop offset="52%" stop-color="#3F5A4C"/>
      <stop offset="100%" stop-color="#143024"/>
    </linearGradient>
    <linearGradient id="u-body" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="28%" stop-color="#BBD0C3"/>
      <stop offset="60%" stop-color="#6B7F73"/>
      <stop offset="100%" stop-color="#164534"/>
    </linearGradient>
    <linearGradient id="u-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08140F" stop-opacity="0.97"/>
      <stop offset="60%" stop-color="#164534" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3F5A4C" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="u-key" cx="34%" cy="15%" r="72%">
      <stop offset="0%" stop-color="#F4F0E6" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#F4F0E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="u-rim" cx="86%" cy="72%" r="40%">
      <stop offset="0%" stop-color="#E6D5B8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E6D5B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="u-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#u-bg)"/>
  <rect width="1200" height="800" fill="url(#u-key)"/>
  <rect width="1200" height="800" fill="url(#u-rim)"/>
  <polygon points="260,0 420,0 530,440 240,440" fill="url(#u-beam)"/>
  <polygon points="800,0 960,0 940,440 690,440" fill="url(#u-beam)"/>

  <rect x="0" y="308" width="1200" height="4" fill="#3F5A4C" opacity="0.38"/>
  <g opacity="0.28" fill="#143024">
    <rect x="70" y="130" width="250" height="174" rx="8"/>
    <rect x="890" y="160" width="240" height="144" rx="8"/>
  </g>

  <path d="M0 440 L1200 440 L1200 800 L0 800 Z" fill="url(#u-floor)"/>
  <ellipse cx="600" cy="656" rx="500" ry="118" fill="#050E0A" opacity="0.6"/>

  <!-- SUV silhouette: tall, boxy, confident -->
  <ellipse cx="600" cy="640" rx="400" ry="38" fill="#050E0A" opacity="0.6"/>
  <path d="M182 566 C200 500 250 452 350 436 L854 436 C948 452 1000 496 1020 566 L1034 588 C1046 602 1040 622 1022 628 L196 628 C178 622 172 602 182 566 Z" fill="url(#u-body)"/>
  <!-- boxy greenhouse -->
  <path d="M352 440 L360 330 C368 314 384 306 402 306 L806 306 C826 306 840 314 848 332 L862 440 Z" fill="#E2DBC9"/>
  <path d="M368 434 L376 340 C382 328 392 322 406 322 L512 322 L512 434 Z" fill="url(#u-glass)"/>
  <path d="M530 322 L694 322 L694 434 L530 434 Z" fill="url(#u-glass)"/>
  <path d="M712 322 L798 322 C812 322 822 328 828 340 L836 434 L712 434 Z" fill="url(#u-glass)"/>
  <!-- roof rails -->
  <rect x="380" y="296" width="420" height="12" rx="6" fill="#8DB8A0" opacity="0.8"/>
  <!-- lower cladding -->
  <rect x="196" y="566" width="828" height="26" rx="12" fill="#143024" opacity="0.55"/>
  <path d="M216 564 C260 508 356 480 470 476 L486 492 C372 498 300 520 262 578 Z" fill="#FFFFFF" opacity="0.24"/>
  <path d="M200 566 C350 540 900 538 1016 570" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="986" y="518" width="48" height="18" rx="9" fill="#F2EEE3" opacity="0.95"/>
  <rect x="178" y="522" width="42" height="15" rx="7" fill="#E6D5B8" opacity="0.9"/>
  <path d="M596 322 L596 620" stroke="#0E2018" stroke-opacity="0.3" stroke-width="3"/>

  <circle cx="386" cy="626" r="76" fill="#050E0A"/>
  <circle cx="386" cy="626" r="76" fill="none" stroke="#3F5A4C" stroke-width="4"/>
  <circle cx="386" cy="626" r="40" fill="#3A4A3F"/>
  <circle cx="386" cy="626" r="40" fill="none" stroke="#8DB8A0" stroke-width="3"/>
  <circle cx="386" cy="626" r="15" fill="#E2DBC9"/>

  <circle cx="874" cy="626" r="76" fill="#050E0A"/>
  <circle cx="874" cy="626" r="76" fill="none" stroke="#3F5A4C" stroke-width="4"/>
  <circle cx="874" cy="626" r="40" fill="#3A4A3F"/>
  <circle cx="874" cy="626" r="40" fill="none" stroke="#8DB8A0" stroke-width="3"/>
  <circle cx="874" cy="626" r="15" fill="#E2DBC9"/>

  <g opacity="0.2" fill="#A9E5C0">
    <rect x="210" y="716" width="250" height="5" rx="3"/>
    <rect x="510" y="734" width="340" height="5" rx="3"/>
    <rect x="890" y="716" width="200" height="5" rx="3"/>
  </g>
</svg>
