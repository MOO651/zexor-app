<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ZEXOR oversized drop-shoulder tee">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08140F"/>
      <stop offset="55%" stop-color="#143024"/>
      <stop offset="100%" stop-color="#3A4A3F"/>
    </linearGradient>
    <radialGradient id="t-key" cx="34%" cy="12%" r="74%">
      <stop offset="0%" stop-color="#FBF8F1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FBF8F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-fabric" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="48%" stop-color="#F2EEE3"/>
      <stop offset="100%" stop-color="#BBD0C3"/>
    </linearGradient>
    <linearGradient id="t-print" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7F73"/>
      <stop offset="100%" stop-color="#3A4A3F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#t-bg)"/>
  <rect width="1200" height="800" fill="url(#t-key)"/>
  <ellipse cx="600" cy="742" rx="300" ry="34" fill="#050E0A" opacity="0.55"/>

  <!-- Oversized body with drop shoulders. Side seams are near-straight and the
       hem is only gently curved, so it reads as a tee rather than a sack. -->
  <path d="M326 238 C382 210 466 196 528 196 L672 196 C734 196 818 210 874 238 C904 256 918 292 914 338 L902 620 C900 654 886 682 854 696 C800 716 400 716 346 696 C314 682 300 654 298 620 L286 338 C282 292 296 256 326 238 Z" fill="url(#t-fabric)"/>

  <!-- Drop-shoulder sleeves, tapered and rounded at the cuff. -->
  <path d="M320 236 C282 250 254 290 242 340 L210 480 C200 518 220 552 258 558 C292 564 314 544 318 516 L348 388 Z" fill="#F4F0E6"/>
  <path d="M880 236 C918 250 946 290 958 340 L990 480 C1000 518 980 552 942 558 C908 564 886 544 882 516 L852 388 Z" fill="#F2EEE3"/>

  <!-- Ribbed collar. -->
  <path d="M526 194 C560 226 640 226 674 194 C658 180 634 172 600 172 C566 172 542 180 526 194 Z" fill="#E2DBC9"/>
  <path d="M546 194 C574 212 626 212 654 194" fill="none" stroke="#8DB8A0" stroke-width="4"/>

  <!-- Soft fold lines — real garment, not a flat cut-out. -->
  <g stroke="#BBD0C3" stroke-opacity="0.5" stroke-width="3" fill="none">
    <path d="M430 300 C448 400 442 520 462 650"/>
    <path d="M770 300 C752 400 758 520 738 650"/>
    <path d="M322 384 C358 396 376 424 382 460"/>
    <path d="M878 384 C842 396 824 424 818 460"/>
  </g>

  <!-- High-density screen print. -->
  <text x="600" y="408" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="12" fill="url(#t-print)">ZEXOR</text>
  <text x="600" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#6B7F73">SIGNAL DROP-SHOULDER</text>
  <rect x="510" y="470" width="180" height="4" rx="2" fill="#6B7F73" opacity="0.7"/>

  <!-- Neck tag. -->
  <rect x="576" y="196" width="48" height="26" rx="4" fill="#F4F0E6" stroke="#8DB8A0" stroke-width="2"/>
</svg>
