<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Luxury sedan">
  <defs>
    <!-- Bright showroom: a light backdrop makes the car body read as painted
         metal instead of a dark silhouette. -->
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F0E6"/>
      <stop offset="46%" stop-color="#BBD0C3"/>
      <stop offset="100%" stop-color="#86A092"/>
    </linearGradient>
    <linearGradient id="s-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7F73"/>
      <stop offset="52%" stop-color="#3F5A4C"/>
      <stop offset="100%" stop-color="#143024"/>
    </linearGradient>
    <linearGradient id="s-body" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="30%" stop-color="#BBD0C3"/>
      <stop offset="62%" stop-color="#6B7F73"/>
      <stop offset="100%" stop-color="#3A4A3F"/>
    </linearGradient>
    <linearGradient id="s-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08140F" stop-opacity="0.97"/>
      <stop offset="60%" stop-color="#164534" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6B7F73" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="s-key" cx="36%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#F4F0E6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F4F0E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-rim" cx="84%" cy="70%" r="42%">
      <stop offset="0%" stop-color="#E6D5B8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E6D5B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#s-bg)"/>
  <rect width="1200" height="800" fill="url(#s-key)"/>
  <rect width="1200" height="800" fill="url(#s-rim)"/>

  <!-- Soft studio light pools on the back wall, instead of the two hard grey
       slabs that read as random rectangles behind the car. -->
  <ellipse cx="360" cy="230" rx="300" ry="150" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="880" cy="210" rx="260" ry="130" fill="#FFFFFF" opacity="0.28"/>

  <rect x="0" y="300" width="1200" height="3" fill="#86A092" opacity="0.5"/>

  <path d="M0 430 L1200 430 L1200 800 L0 800 Z" fill="url(#s-floor)"/>

  <!-- One soft contact shadow grounds the car without blacking out the floor. -->
  <ellipse cx="600" cy="640" rx="420" ry="56" fill="#143024" opacity="0.45"/>
  <path d="M170 560 C196 480 286 448 420 440 L800 440 C906 448 986 486 1032 560 L1052 580 C1066 594 1060 616 1042 622 L186 622 C168 616 162 592 170 560 Z" fill="url(#s-body)"/>
  <path d="M418 446 C520 372 726 366 826 446 L756 452 L470 454 Z" fill="#EFE9DA"/>
  <path d="M458 452 C548 396 714 392 792 452 L474 456 Z" fill="url(#s-glass)"/>
  <path d="M452 460 L796 460 L776 546 L470 546 Z" fill="url(#s-glass)"/>
  <path d="M204 558 C248 496 350 466 480 460 L498 476 C370 484 288 508 250 574 Z" fill="#FFFFFF" opacity="0.26"/>
  <path d="M190 562 C340 536 900 532 1036 564" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="1000" y="524" width="50" height="18" rx="9" fill="#F2EEE3" opacity="0.95"/>
  <rect x="166" y="528" width="44" height="15" rx="7" fill="#E6D5B8" opacity="0.9"/>
  <path d="M596 458 L596 612" stroke="#0E2018" stroke-opacity="0.32" stroke-width="3"/>
  <path d="M780 458 L780 608" stroke="#0E2018" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Wheels: solid tyre, alloy rim, then a bright hub. -->
  <circle cx="392" cy="618" r="68" fill="#0E2018"/>
  <circle cx="392" cy="618" r="68" fill="none" stroke="#3F5A4C" stroke-width="4"/>
  <circle cx="392" cy="618" r="38" fill="#86A092"/>
  <circle cx="392" cy="618" r="38" fill="none" stroke="#EFE9DA" stroke-width="3"/>
  <circle cx="392" cy="618" r="14" fill="#F4F0E6"/>
  <g stroke="#6B7F73" stroke-width="4" stroke-linecap="round">
    <path d="M392 584 V600 M392 636 V652 M358 618 H374 M410 618 H426"/>
  </g>

  <circle cx="866" cy="618" r="68" fill="#0E2018"/>
  <circle cx="866" cy="618" r="68" fill="none" stroke="#3F5A4C" stroke-width="4"/>
  <circle cx="866" cy="618" r="38" fill="#86A092"/>
  <circle cx="866" cy="618" r="38" fill="none" stroke="#EFE9DA" stroke-width="3"/>
  <circle cx="866" cy="618" r="14" fill="#F4F0E6"/>
  <g stroke="#6B7F73" stroke-width="4" stroke-linecap="round">
    <path d="M866 584 V600 M866 636 V652 M832 618 H848 M884 618 H900"/>
  </g>

  <g opacity="0.2" fill="#A9E5C0">
    <rect x="200" y="704" width="240" height="5" rx="3"/>
    <rect x="500" y="722" width="360" height="5" rx="3"/>
    <rect x="900" y="704" width="200" height="5" rx="3"/>
  </g>
</svg>
