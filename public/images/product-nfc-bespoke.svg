<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ZEXOR Bespoke Signature NFC card">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07130E"/>
      <stop offset="52%" stop-color="#0E2A20"/>
      <stop offset="100%" stop-color="#1F6B4F"/>
    </linearGradient>
    <radialGradient id="b-key" cx="32%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#EFE9DA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EFE9DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b-rim" cx="80%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#A9E5C0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#A9E5C0" stop-opacity="0"/>
    </radialGradient>
    <!-- Brushed cream-to-sage finish with a soft sheen. -->
    <linearGradient id="b-card" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#EFE9DA"/>
      <stop offset="38%" stop-color="#A9E5C0"/>
      <stop offset="100%" stop-color="#8DB8A0"/>
    </linearGradient>
    <linearGradient id="b-rim-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A9E5C0"/>
      <stop offset="50%" stop-color="#8DB8A0"/>
      <stop offset="100%" stop-color="#164534"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#b-bg)"/>
  <rect width="1200" height="800" fill="url(#b-key)"/>
  <rect width="1200" height="800" fill="url(#b-rim)"/>

  <ellipse cx="600" cy="628" rx="310" ry="48" fill="#07130E" opacity="0.62"/>

  <g transform="rotate(-6 600 400)" opacity="0.5">
    <rect x="326" y="244" width="548" height="342" rx="34" fill="#143024"/>
    <rect x="326" y="244" width="548" height="342" rx="34" fill="none" stroke="#3F5A4C" stroke-width="3"/>
  </g>

  <g transform="rotate(-6 600 400)">
    <rect x="316" y="224" width="566" height="354" rx="36" fill="#07130E" opacity="0.55"/>
    <rect x="312" y="216" width="566" height="354" rx="36" fill="url(#b-card)"/>
    <rect x="326" y="230" width="538" height="326" rx="28" fill="none" stroke="url(#b-rim-light)" stroke-width="2.5" stroke-opacity="0.9"/>
    <path d="M312 216 L616 216 L416 570 L312 570 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Chip, raised on a dark bezel. -->
    <rect x="356" y="268" width="86" height="66" rx="14" fill="#0E2A20" opacity="0.85"/>
    <rect x="360" y="272" width="78" height="58" rx="12" fill="url(#b-rim-light)"/>
    <rect x="360" y="272" width="78" height="58" rx="12" fill="none" stroke="#3F5A4C" stroke-opacity="0.9" stroke-width="2.5"/>
    <g fill="#3F5A4C" opacity="0.5">
      <rect x="372" y="284" width="24" height="13" rx="3"/>
      <rect x="402" y="284" width="24" height="13" rx="3"/>
      <rect x="372" y="305" width="54" height="13" rx="3"/>
    </g>

    <!-- Monogram seal. -->
    <circle cx="778" cy="318" r="50" fill="none" stroke="url(#b-rim-light)" stroke-width="3" stroke-opacity="0.85"/>
    <text x="778" y="334" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#164534">Z</text>

    <g fill="none" stroke="#3F5A4C" stroke-linecap="round" stroke-width="7" opacity="0.7">
      <path d="M668 392 a76 76 0 0 1 0 104"/>
      <path d="M696 370 a118 118 0 0 1 0 148" opacity="0.6"/>
    </g>

    <text x="360" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" letter-spacing="7" fill="#12241B">ZEXOR</text>
    <text x="362" y="494" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#3F5A4C">BESPOKE · SIGNATURE</text>
    <rect x="362" y="512" width="152" height="3.5" rx="2" fill="url(#b-rim-light)"/>
  </g>

  <circle cx="916" cy="198" r="11" fill="#F3935F"/>
  <circle cx="950" cy="198" r="6" fill="#A9E5C0"/>
</svg>
