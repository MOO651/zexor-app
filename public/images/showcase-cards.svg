<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Smart NFC identity cards">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07130E"/>
      <stop offset="52%" stop-color="#0E2A20"/>
      <stop offset="100%" stop-color="#1F6B4F"/>
    </linearGradient>
    <radialGradient id="sc-key" cx="30%" cy="14%" r="74%">
      <stop offset="0%" stop-color="#A9E5C0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#A9E5C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-rose" cx="84%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#F3935F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F3935F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-cardA" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#EFE9DA"/>
      <stop offset="38%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#8DB8A0"/>
    </linearGradient>
    <linearGradient id="sc-cardB" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#EFE9DA"/>
      <stop offset="42%" stop-color="#A9E5C0"/>
      <stop offset="100%" stop-color="#1F6B4F"/>
    </linearGradient>
    <linearGradient id="sc-cardC" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#EFE9DA"/>
      <stop offset="40%" stop-color="#A9E5C0"/>
      <stop offset="100%" stop-color="#8DB8A0"/>
    </linearGradient>
    <linearGradient id="sc-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A9E5C0"/>
      <stop offset="50%" stop-color="#8DB8A0"/>
      <stop offset="100%" stop-color="#164534"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sc-bg)"/>
  <rect width="1200" height="800" fill="url(#sc-key)"/>
  <rect width="1200" height="800" fill="url(#sc-rose)"/>
  <ellipse cx="600" cy="640" rx="400" ry="60" fill="#07130E" opacity="0.6"/>

  <!-- Three cards fanned like a premium product spread. -->
  <g transform="rotate(-16 470 420) translate(-60 40)">
    <rect x="250" y="250" width="440" height="280" rx="28" fill="#07130E" opacity="0.55"/>
    <rect x="246" y="242" width="440" height="280" rx="28" fill="url(#sc-cardC)"/>
    <rect x="246" y="242" width="440" height="280" rx="28" fill="none" stroke="#EFE9DA" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="286" y="288" width="66" height="50" rx="10" fill="url(#sc-chip)"/>
    <text x="286" y="452" font-family="Georgia, serif" font-size="40" font-weight="700" letter-spacing="6" fill="#12241B">ZEXOR</text>
  </g>

  <g transform="rotate(-4 600 420) translate(-10 0)">
    <rect x="380" y="238" width="452" height="288" rx="28" fill="#07130E" opacity="0.55"/>
    <rect x="376" y="230" width="452" height="288" rx="28" fill="url(#sc-cardA)"/>
    <rect x="376" y="230" width="452" height="288" rx="28" fill="none" stroke="#EFE9DA" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="416" y="278" width="68" height="52" rx="10" fill="url(#sc-chip)"/>
    <g fill="none" stroke="#1F6B4F" stroke-linecap="round" stroke-width="7">
      <path d="M700 292 a76 76 0 0 1 0 104" opacity="0.95"/>
      <path d="M730 270 a118 118 0 0 1 0 148" opacity="0.65"/>
    </g>
    <text x="416" y="452" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="7" fill="#12241B">ZEXOR</text>
    <text x="418" y="486" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#3F5A4C">CONNECTED IDENTITY</text>
  </g>

  <g transform="rotate(10 740 430) translate(60 40)">
    <rect x="560" y="252" width="440" height="280" rx="28" fill="#07130E" opacity="0.55"/>
    <rect x="556" y="244" width="440" height="280" rx="28" fill="url(#sc-cardB)"/>
    <rect x="556" y="244" width="440" height="280" rx="28" fill="none" stroke="#EFE9DA" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="662" cy="356" r="34" fill="#164534" opacity="0.9"/>
    <circle cx="662" cy="347" r="13" fill="#A9E5C0"/>
    <path d="M639 372 a23 23 0 0 1 46 0 Z" fill="#A9E5C0"/>
    <g fill="#164534" opacity="0.8">
      <rect x="718" y="336" width="186" height="12" rx="6"/>
      <rect x="718" y="360" width="226" height="12" rx="6"/>
    </g>
    <text x="596" y="452" font-family="Georgia, serif" font-size="40" font-weight="700" letter-spacing="6" fill="#164534">ZEXOR</text>
  </g>

  <g opacity="0.22" fill="#A9E5C0">
    <rect x="120" y="700" width="300" height="5" rx="3"/>
    <rect x="820" y="716" width="260" height="5" rx="3"/>
  </g>
</svg>
