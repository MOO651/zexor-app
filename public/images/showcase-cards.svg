<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Smart NFC identity cards">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08100d"/>
      <stop offset="52%" stop-color="#15291f"/>
      <stop offset="100%" stop-color="#2c4a3a"/>
    </linearGradient>
    <radialGradient id="sc-key" cx="30%" cy="14%" r="74%">
      <stop offset="0%" stop-color="#dcfff2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#dcfff2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-rose" cx="84%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#f0c9ae" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0c9ae" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-cardA" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#eef5f0"/>
      <stop offset="100%" stop-color="#9db8a9"/>
    </linearGradient>
    <linearGradient id="sc-cardB" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#eafff6"/>
      <stop offset="42%" stop-color="#a9ecd0"/>
      <stop offset="100%" stop-color="#4f9d7d"/>
    </linearGradient>
    <linearGradient id="sc-cardC" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fff4ef"/>
      <stop offset="40%" stop-color="#eec3b0"/>
      <stop offset="100%" stop-color="#a9705c"/>
    </linearGradient>
    <linearGradient id="sc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6dfae"/>
      <stop offset="50%" stop-color="#d8ac5f"/>
      <stop offset="100%" stop-color="#a97f3c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sc-bg)"/>
  <rect width="1200" height="800" fill="url(#sc-key)"/>
  <rect width="1200" height="800" fill="url(#sc-rose)"/>
  <ellipse cx="600" cy="640" rx="400" ry="60" fill="#020604" opacity="0.6"/>

  <!-- Three cards fanned like a premium product spread. -->
  <g transform="rotate(-16 470 420) translate(-60 40)">
    <rect x="250" y="250" width="440" height="280" rx="28" fill="#0f1e17" opacity="0.55"/>
    <rect x="246" y="242" width="440" height="280" rx="28" fill="url(#sc-cardC)"/>
    <rect x="246" y="242" width="440" height="280" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="286" y="288" width="66" height="50" rx="10" fill="url(#sc-gold)"/>
    <text x="286" y="452" font-family="Georgia, serif" font-size="40" font-weight="700" letter-spacing="6" fill="#5a332b">ZEXOR</text>
  </g>

  <g transform="rotate(-4 600 420) translate(-10 0)">
    <rect x="380" y="238" width="452" height="288" rx="28" fill="#0f1e17" opacity="0.55"/>
    <rect x="376" y="230" width="452" height="288" rx="28" fill="url(#sc-cardA)"/>
    <rect x="376" y="230" width="452" height="288" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="416" y="278" width="68" height="52" rx="10" fill="url(#sc-gold)"/>
    <g fill="none" stroke="#35614a" stroke-linecap="round" stroke-width="7">
      <path d="M700 292 a76 76 0 0 1 0 104" opacity="0.95"/>
      <path d="M730 270 a118 118 0 0 1 0 148" opacity="0.65"/>
    </g>
    <text x="416" y="452" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="7" fill="#24382d">ZEXOR</text>
    <text x="418" y="486" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#5c7a69">CONNECTED IDENTITY</text>
  </g>

  <g transform="rotate(10 740 430) translate(60 40)">
    <rect x="560" y="252" width="440" height="280" rx="28" fill="#0f1e17" opacity="0.55"/>
    <rect x="556" y="244" width="440" height="280" rx="28" fill="url(#sc-cardB)"/>
    <rect x="556" y="244" width="440" height="280" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="662" cy="356" r="34" fill="#1d3b2f" opacity="0.9"/>
    <circle cx="662" cy="347" r="13" fill="#a9ecd0"/>
    <path d="M639 372 a23 23 0 0 1 46 0 Z" fill="#a9ecd0"/>
    <g fill="#1d3b2f" opacity="0.8">
      <rect x="718" y="336" width="186" height="12" rx="6"/>
      <rect x="718" y="360" width="226" height="12" rx="6"/>
    </g>
    <text x="596" y="452" font-family="Georgia, serif" font-size="40" font-weight="700" letter-spacing="6" fill="#173a2d">ZEXOR</text>
  </g>

  <g opacity="0.22" fill="#a6e6c4">
    <rect x="120" y="700" width="300" height="5" rx="3"/>
    <rect x="820" y="716" width="260" height="5" rx="3"/>
  </g>
</svg>
