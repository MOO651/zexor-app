<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ZEXOR Social NFC card">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08140F"/>
      <stop offset="52%" stop-color="#164534"/>
      <stop offset="100%" stop-color="#1F6B4F"/>
    </linearGradient>
    <radialGradient id="s-key" cx="30%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#F4F0E6" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#F4F0E6" stop-opacity="0"/>
    </radialGradient>
    <!-- Mint finish. -->
    <linearGradient id="s-card" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="42%" stop-color="#A9E5C0"/>
      <stop offset="100%" stop-color="#6B7F73"/>
    </linearGradient>
    <linearGradient id="s-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6D5B8"/>
      <stop offset="50%" stop-color="#F3935F"/>
      <stop offset="100%" stop-color="#C65F36"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#s-bg)"/>
  <rect width="1200" height="800" fill="url(#s-key)"/>

  <ellipse cx="600" cy="628" rx="312" ry="48" fill="#050E0A" opacity="0.6"/>

  <!-- Back card peeking out, rotated the other way for a casual stack. -->
  <g transform="rotate(7 600 400)" opacity="0.5">
    <rect x="328" y="246" width="544" height="340" rx="34" fill="#143024"/>
    <rect x="328" y="246" width="544" height="340" rx="34" fill="none" stroke="#3F5A4C" stroke-width="3"/>
  </g>

  <g transform="rotate(7 600 400)">
    <rect x="318" y="226" width="562" height="352" rx="36" fill="#0E2018" opacity="0.5"/>
    <rect x="314" y="218" width="562" height="352" rx="36" fill="url(#s-card)"/>
    <rect x="314" y="218" width="562" height="352" rx="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M314 218 L620 218 L424 570 L314 570 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Chip, raised on a dark bezel. -->
    <rect x="356" y="270" width="86" height="66" rx="14" fill="#0E2018" opacity="0.85"/>
    <rect x="360" y="274" width="78" height="58" rx="12" fill="url(#s-chip)"/>
    <rect x="360" y="274" width="78" height="58" rx="12" fill="none" stroke="#3A4A3F" stroke-opacity="0.9" stroke-width="2.5"/>
    <!-- Contact pads are drawn as recessed darker plates so the chip never
         reads as a blank yellow box on the mint face. -->
    <g fill="#3A4A3F" opacity="0.55">
      <rect x="372" y="286" width="24" height="13" rx="3"/>
      <rect x="402" y="286" width="24" height="13" rx="3"/>
      <rect x="372" y="307" width="54" height="13" rx="3"/>
    </g>

    <!-- Profile avatar block — this card is about your social identity. -->
    <circle cx="412" cy="404" r="38" fill="#164534" opacity="0.9"/>
    <circle cx="412" cy="394" r="14" fill="#A9E5C0"/>
    <path d="M386 422 a26 26 0 0 1 52 0 Z" fill="#A9E5C0"/>

    <!-- Link rows, like a profile with connected accounts. -->
    <g fill="#164534" opacity="0.82">
      <rect x="478" y="378" width="220" height="14" rx="7"/>
      <rect x="478" y="404" width="272" height="14" rx="7"/>
      <rect x="478" y="430" width="184" height="14" rx="7"/>
    </g>

    <text x="360" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="7" fill="#164534">ZEXOR</text>
    <text x="362" y="534" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#1F6B4F">SOCIAL · TAP TO SHARE</text>
  </g>

  <circle cx="912" cy="200" r="12" fill="#A9E5C0"/>
  <circle cx="948" cy="200" r="6" fill="#F3935F"/>
</svg>
