<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ZEXOR Archive — curated vintage objects</title>
  <desc id="desc">An editorial still life of a brass vintage timepiece and sculptural object against a midnight background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c2c"/><stop offset=".58" stop-color="#202b3a"/><stop offset="1" stop-color="#080d15"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9c8b65" stop-opacity=".28"/><stop offset="1" stop-color="#9c8b65" stop-opacity="0"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2dfaa"/><stop offset=".28" stop-color="#9f7b3f"/><stop offset=".54" stop-color="#e8d09a"/><stop offset=".8" stop-color="#6d512c"/><stop offset="1" stop-color="#c8a768"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#9ba0a0"/><stop offset=".5" stop-color="#444d56"/><stop offset="1" stop-color="#202a35"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
