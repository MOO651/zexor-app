    <rect x="100" y="74" width="60" height="38" rx="12" fill="url(#brass)"/>
    <circle cx="130" cy="250" r="150" fill="#0c1219" stroke="url(#brass)" stroke-width="17"/>
    <circle cx="130" cy="250" r="126" fill="#d6c7a3" stroke="#6f572e" stroke-width="4"/>
    <circle cx="130" cy="250" r="108" fill="#e5d9bd" stroke="#b29a67" stroke-width="2"/>
