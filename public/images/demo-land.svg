<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Development land plot">
  <defs>
    <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2018"/>
      <stop offset="42%" stop-color="#164534"/>
      <stop offset="100%" stop-color="#6B7F73"/>
    </linearGradient>
    <linearGradient id="l-land" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6B7F73"/>
      <stop offset="55%" stop-color="#3A4A3F"/>
      <stop offset="100%" stop-color="#143024"/>
    </linearGradient>
    <linearGradient id="l-land2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7F73"/>
      <stop offset="100%" stop-color="#164534"/>
    </linearGradient>
    <radialGradient id="l-sun" cx="70%" cy="16%" r="42%">
      <stop offset="0%" stop-color="#EFE9DA" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#EFE9DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86A092"/>
      <stop offset="100%" stop-color="#3A4A3F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#l-sky)"/>
  <rect width="1200" height="800" fill="url(#l-sun)"/>

  <!-- horizon development silhouette -->
  <g opacity="0.36" fill="#6B7F73">
    <rect x="60" y="368" width="150" height="90" rx="6"/>
    <rect x="240" y="344" width="120" height="114" rx="6"/>
    <rect x="900" y="356" width="140" height="102" rx="6"/>
    <rect x="1060" y="330" width="110" height="128" rx="6"/>
  </g>
  <g opacity="0.28" fill="#3F5A4C">
    <rect x="400" y="392" width="90" height="66" rx="5"/>
    <rect x="700" y="386" width="96" height="72" rx="5"/>
  </g>

  <!-- land parcels in perspective -->
  <path d="M0 452 L1200 452 L1200 800 L0 800 Z" fill="url(#l-land)"/>
  <path d="M0 470 L540 458 L640 800 L0 800 Z" fill="url(#l-land2)" opacity="0.85"/>
  <path d="M1200 470 L660 458 L560 800 L1200 800 Z" fill="#3A4A3F" opacity="0.9"/>

  <!-- parcel boundary lines -->
  <g stroke="#A9E5C0" stroke-opacity="0.5" stroke-width="3" fill="none">
    <path d="M120 462 L180 800"/>
    <path d="M330 460 L400 800"/>
    <path d="M540 458 L620 800"/>
    <path d="M760 460 L840 800"/>
    <path d="M980 462 L1060 800"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" fill="none">
    <path d="M0 520 L1200 520"/>
    <path d="M0 600 L1200 600"/>
    <path d="M0 692 L1200 692"/>
  </g>

  <!-- access road -->
  <path d="M0 716 L1200 716 L1200 780 L0 780 Z" fill="url(#l-road)" opacity="0.62"/>
  <g fill="#EFE9DA" opacity="0.75">
    <rect x="120" y="744" width="120" height="8" rx="4"/>
    <rect x="330" y="744" width="120" height="8" rx="4"/>
    <rect x="540" y="744" width="120" height="8" rx="4"/>
    <rect x="750" y="744" width="120" height="8" rx="4"/>
    <rect x="960" y="744" width="120" height="8" rx="4"/>
  </g>

  <!-- plot marker flag -->
  <g>
    <rect x="596" y="500" width="4" height="90" fill="#E2DBC9"/>
    <path d="M600 500 L664 516 L600 536 Z" fill="#A9E5C0" opacity="0.9"/>
  </g>
</svg>
