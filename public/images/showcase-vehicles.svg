      <stop offset="34%" stop-color="#b9d8c8"/>
      <stop offset="68%" stop-color="#5d8a70"/>
      <stop offset="100%" stop-color="#2c4838"/>
    </linearGradient>
    <linearGradient id="carTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff1e8"/>
