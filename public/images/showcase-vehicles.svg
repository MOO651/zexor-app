      <stop offset="100%" stop-color="#264a39"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3329"/>
      <stop offset="100%" stop-color="#050b08"/>
