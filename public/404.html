<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEXOR — جارٍ التحويل</title>
    <script>
      // Single-page-app fallback for static hosts (GitHub Pages, S3, Netlify).
      // Keep GitHub Pages' project prefix, but discard any extra path segments.
      (function () {
        var path = window.location.pathname;
        var hash = window.location.hash || '';
        var projectBase = '/zexor-app/';
        var base = path === '/zexor-app' || path.indexOf(projectBase) === 0
          ? projectBase
          : '/';
        window.location.replace(base + hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f8f7;
        color: #2d4236;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      p {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <p aria-live="polite">ZEXOR · جارٍ التحويل...</p>
  </body>
</html>
