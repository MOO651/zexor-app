name: Deploy ZEXOR to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Check Supabase Edge Functions
        run: npx --yes deno check supabase/functions/paymob-create-intention/index.ts supabase/functions/paymob-webhook/index.ts supabase/functions/telegram-test-notification/index.ts

      - name: Build
        run: npm run build
        env:
          # These are the browser-safe project URL and anon key. Admin access
          # is enforced by Supabase Auth + the store_admins table, not a build
          # time password.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Production is hosted on Vercel. Keep GitHub Pages deployment opt-in so
  # repositories without Pages enabled still get a fully green quality/build check.
  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true' && vars.GITHUB_PAGES_CONFIGURED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
